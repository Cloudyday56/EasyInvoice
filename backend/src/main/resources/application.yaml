spring:
  application:
    name: easyinvoice
  datasource:
    # stringtype=unspecified lets Postgres cast text parameters to the column type
    # (numeric, date, boolean, jsonb). The seed loader relies on it to insert CSV values as-is.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/easyinvoice?stringtype=unspecified}
    username: ${DB_USER:easyinvoice}
    password: ${DB_PASSWORD:easyinvoice}
  sql:
    init:
      mode: always  # Spring runs schema.sql at startup, before Hibernate validates the mapping
      # schema.sql contains a trigger function with ';' inside $$...$$, which Spring's script splitter
      # would cut in half. A separator that never appears makes it run the whole file as one statement.
      separator: "^^^ END OF SCRIPT ^^^"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # schema.sql owns the tables; Hibernate only checks the entities match them
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  data-dir: ${DATA_DIR:../data}          # the sample dataset (CSV, inbox, incoming_invoices)
  storage-dir: ${STORAGE_DIR:./storage}  # uploaded documents, keyed by SHA-256
  pipeline:
    poll-ms: 500        # how often the runner checks the jobs table
    step-delay-ms: 800  # pause between nodes so the demo can watch the invoice move
    max-attempts: 3
  bank:
    settle-after-ms: 4000  # mock bank: SENT -> SETTLED after this delay
  extractor: ${EXTRACTOR:fake}   # fake | llm
  llm:
    base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}  # never hard-code; set it in the root .env file
    model: ${LLM_MODEL:anthropic/claude-sonnet-4.5}
