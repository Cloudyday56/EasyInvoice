server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # During local development the Spring Boot backend runs on the host at
    # http://localhost:8080. Docker Desktop resolves host.docker.internal;
    # docker-compose.yml also adds the host-gateway mapping for Linux.
    location /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing fallback for any future SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
