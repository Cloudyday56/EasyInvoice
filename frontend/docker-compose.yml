# Frontend only. Start the backend on the host (http://localhost:8080) first, then:
#   docker compose -f frontend/docker-compose.yml up --build
#
# The root docker-compose.yml remains the full stack (db + backend + frontend).
services:
  frontend:
    build: .
    ports:
      - "5173:80"
    volumes:
      - ./nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
